<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلبات البيت — البيت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <main class="app-main">
      <div class="main-column">
        <header class="page-header">
          <h1 id="household-title" class="page-title">البيت</h1>
          <p id="household-subtitle" class="page-subtitle">جاري التحميل…</p>
        </header>

        <div id="household-error" class="alert-error" role="alert" hidden></div>

        <section class="card household-card">
          <h2 class="section-title">رمز الدعوة</h2>
          <p class="page-subtitle">شارك هذا الرمز مع أفراد عائلتك للانضمام لنفس القائمة.</p>
          <div class="invite-code-box">
            <code id="invite-code-value" class="invite-code-text" dir="ltr">------</code>
            <div class="invite-code-actions">
              <button type="button" id="copy-invite-btn" class="btn btn-primary">نسخ الرمز</button>
              <button type="button" id="rotate-invite-btn" class="btn btn-secondary">تجديد الرمز</button>
            </div>
          </div>
        </section>

        <section class="card household-card">
          <h2 class="section-title">أفراد البيت</h2>
          <ul id="members-list" class="members-list"></ul>
        </section>

        <section class="card household-card">
          <h2 class="section-title">الحساب</h2>
          <div>
            <button type="button" id="logout-btn" class="btn btn-text btn-danger-text">تسجيل الخروج</button>
          </div>
        </section>
      </div>
    </main>
    <nav id="app-tabbar" class="bottom-tab-bar" aria-label="التنقل السفلي"></nav>
  </div>
  <div id="toast-root"></div>
  <script type="module" src="js/pages/household.js"></script>
</body>
</html>
