<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلبات البيت — وضع السوق</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <main class="app-main">
      <div class="main-column">
        <header class="page-header page-header-row">
          <div>
            <h1 class="page-title">وضع السوق</h1>
            <p id="shop-subtitle" class="page-subtitle">جاري التحميل…</p>
          </div>
          <a href="list.html" class="btn btn-secondary">العودة للقائمة</a>
        </header>

        <section id="shop-progress-card" class="card shop-progress-card" hidden>
          <div class="shop-progress-header">
            <span id="shop-progress-text" class="field-label">0 من 0</span>
            <span id="shop-progress-pct" class="badge-muted">0%</span>
          </div>
          <div class="shop-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="shop-progress-fill" class="shop-progress-fill"></div>
          </div>
        </section>

        <div id="shop-error" class="alert-error" role="alert" hidden></div>
        <div id="shop-content" class="main-column"></div>
      </div>
    </main>
    <nav id="app-tabbar" class="bottom-tab-bar" aria-label="التنقل السفلي"></nav>
  </div>
  <div id="toast-root"></div>
  <script type="module" src="js/pages/shop.js"></script>
</body>
</html>
